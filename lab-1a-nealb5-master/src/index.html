<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task List Application</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <!-- Navigation bar -->
  <nav>
    <a href="">Home</a>
  </nav>

  <!-- Page title -->
  <h1>Task List Application</h1>

  <!-- Sort and filter checkboxes -->
  <label><input type="checkbox"> Sort by date</label><br>
  <label><input type="checkbox"> Filter completed tasks</label>

  <!-- Task List -->
  <ul>
    <li><input type="checkbox"> Grocery Shopping: <span>09-06-2024</span> <button>Delete</button></li>
    <li><input type="checkbox"> Go to gym: <span>09-07-2024</span> <button>Delete</button></li>
  </ul>

  <!-- Form to add tasks -->
  <form>
    <label for="description">Task: </label>
    <input type="text" id="description" name="description" required><br>

    <label for="date">Due Date: </label>
    <input type="date" id="date" name="date" required><br>

    <button type="submit">Create Task</button>
  </form>
</body>
</html>
